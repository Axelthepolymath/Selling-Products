<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV — AXEL</title>
  <style>
    :root { --bg:#070707; --fg:#f4f4f4; --muted:rgba(244,244,244,.55); --line:rgba(244,244,244,.16); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--fg); font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
    header { position:fixed; inset:0 0 auto 0; z-index:10; display:flex; justify-content:space-between; align-items:center; padding:28px 40px; letter-spacing:.42em; font-size:11px; background:linear-gradient(#070707 40%, transparent); }
    header a { color:var(--fg); text-decoration:none; opacity:.7; }
    header a:hover { opacity:1; }
    nav { display:flex; gap:22px; }
    main { padding:130px 40px 90px; max-width:900px; }
    .kicker { letter-spacing:.4em; font-size:11px; color:var(--muted); margin-bottom:14px; }
    h1 { font-weight:400; letter-spacing:.1em; font-size:clamp(34px,5vw,56px); margin-bottom:16px; }
    .lead { color:var(--muted); max-width:560px; line-height:1.7; margin-bottom:48px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .file { border:1px solid var(--line); padding:28px 22px; }
    .file h2 { font-size:13px; letter-spacing:.22em; font-weight:500; margin-bottom:10px; }
    .file p { color:var(--muted); font-size:14px; line-height:1.7; margin-bottom:22px; }
    a.download {
      display:inline-block; padding:12px 18px; border:1px solid rgba(244,244,244,.28);
      color:var(--fg); text-decoration:none; letter-spacing:.28em; font-size:11px;
    }
    a.download:hover { background:#fff; color:#111; }
    .meta { margin-top:40px; color:var(--muted); font-size:13px; line-height:1.8; }
    @media (max-width:700px) { header, main { padding-left:18px; padding-right:18px; } .row { grid-template-columns:1fr; } }
  </style>
</head>
