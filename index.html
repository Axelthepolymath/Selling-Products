<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXEL</title>
  <style>
    :root {
      --bg: #070707;
      --fg: #f4f4f4;
      --muted: rgba(244,244,244,.55);
      --line: rgba(244,244,244,.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
      opacity: .12;
      mix-blend-mode: overlay;
      z-index: 8;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.72) 100%);
      pointer-events: none;
      z-index: 7;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 36px 48px;
      letter-spacing: .42em;
      font-size: 11px;
      font-weight: 500;
    }

    header a {
      color: var(--fg);
      text-decoration: none;
      opacity: .72;
      transition: opacity .25s ease;
    }

    header a:hover { opacity: 1; }

    nav { display: flex; gap: 28px; }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .mark {
      width: 118px;
      height: auto;
      margin-bottom: 34px;
      opacity: 0;
      transform: translateY(12px);
      animation: rise .9s .15s ease forwards;
    }

    .wordmark {
      font-size: clamp(48px, 8vw, 92px);
      font-weight: 400;
      letter-spacing: .28em;
      line-height: 1;
      padding-left: .28em;
      opacity: 0;
      transform: translateY(12px);
      animation: rise .9s .35s ease forwards;
    }

    .tag {
      margin-top: 22px;
      font-size: 11px;
      letter-spacing: .48em;
      color: var(--muted);
      padding-left: .48em;
      opacity: 0;
      animation: rise .9s .55s ease forwards;
    }

    .enter {
      margin-top: 42px;
      display: inline-block;
      min-width: 148px;
      padding: 14px 28px;
      border: 1px solid var(--line);
      color: var(--fg);
      text-decoration: none;
      letter-spacing: .38em;
      font-size: 11px;
      padding-left: calc(28px + .38em);
      background: transparent;
      cursor: pointer;
      opacity: 0;
      animation: rise .9s .75s ease forwards;
      transition: background .25s ease, border-color .25s ease, letter-spacing .25s ease;
    }

    .enter:hover {
      background: #fff;
      color: #111;
      border-color: #fff;
    }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 640px) {
      header { padding: 24px 20px; letter-spacing: .28em; }
      nav { gap: 16px; }
      .mark { width: 86px; }
    }
  </style>
</head>
<body>
  <div class="vignette"></div>

  <header>
    <a href="index.html">AXEL</a>
    <nav>
      <a href="inside.html#products">WORK</a>
      <a href="inside.html#about">ABOUT</a>
      <a href="inside.html#contact">CONTACT</a>
    </nav>
  </header>

  <main class="hero">
    <svg class="mark" viewBox="0 0 200 140" fill="none" aria-hidden="true">
      <polygon points="100,6 168,128 132,128 100,62 68,128 32,128" fill="#f4f4f4"/>
      <polygon points="100,58 118,96 82,96" fill="#070707"/>
      <polygon points="100,78 110,98 90,98" fill="#f4f4f4"/>
    </svg>

    <h1 class="wordmark">AXEL</h1>
    <p class="tag">THE NEXT EDGE</p>
    <a class="enter" href="inside.html">ENTER</a>
  </main>
</body>
</html>
